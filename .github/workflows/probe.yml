name: Phase1 資料源檢查

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 檢查 FinMind 資料源
        run: node scripts/probe.mjs
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
