name: 每日掃描

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'   # 台灣時間 18:30
    - cron: '30 13 * * 1-5'   # 台灣時間 21:30（若前一次資料還沒出來，這次補跑）

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 取回資料
        run: |
          gh release download market-data --pattern 'market-data.tar.gz' --clobber
          tar -xzf market-data.tar.gz

      - name: 更新候選池股價
        id: update
        run: node scripts/update.mjs
        env:
          MODE: daily
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 重建名單、還原股價、掃描、模擬交易
        if: steps.update.outputs.newdata == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node --max-old-space-size=6144 scripts/build-universe.mjs > /dev/null
          node --max-old-space-size=6144 scripts/build-adjusted.mjs > /dev/null
          node --max-old-space-size=6144 scripts/check-gaps.mjs > /dev/null
          node --max-old-space-size=6144 scripts/scan.mjs

      - name: 儲存資料
        run: |
          tar -czf market-data.tar.gz data
          gh release upload market-data market-data.tar.gz --clobber

      - name: 更新網站資料
        run: |
          if [ -f public/daily/latest.json ]; then
            git config user.name "daily-bot"
            git config user.email "daily-bot@users.noreply.github.com"
            git add public/daily/latest.json
            git diff --cached --quiet || (git commit -m "每日掃描 $(date +%F)" && git pull --rebase && git push)
          fi
